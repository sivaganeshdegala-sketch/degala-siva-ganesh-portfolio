        .hero-stage { perspective: 1400px; animation: heroLift 5s ease-in-out infinite; }
        @keyframes heroLift {

        .hero-photo-card {
            --tilt-x: 0deg;
            --tilt-y: 0deg;
            --image-x: 0px;
            --image-y: 0px;
            --light-x: 50%;
            --light-y: 40%;
            transform: perspective(1200px) rotateY(calc(-8deg + var(--tilt-y))) rotateX(calc(3deg + var(--tilt-x))) rotateZ(-2deg);
            transform-style: preserve-3d;
            box-shadow: 24px 28px 70px rgba(0, 0, 0, .55), -18px 0 65px rgba(124, 103, 255, .17);
            transition: transform .22s ease-out, box-shadow .5s ease;
            will-change: transform;
        }
        .hero-photo-card::before {
            content: "";
            position: absolute;
            z-index: 4;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: radial-gradient(circle at var(--light-x) var(--light-y), rgba(202, 190, 255, .22), transparent 38%);
            mix-blend-mode: screen;
        }
        .hero-photo-window {
            position: absolute;
            inset: 0;
            overflow: hidden;
            border-radius: inherit;
            transform-style: preserve-3d;
        }
        .hero-depth-image {
            transform: translate3d(var(--image-x), var(--image-y), 34px) scale(1.1);

            pointer-events: none;

        .hero-orbit { animation: orbitDrift 7s ease-in-out infinite; }
        .hero-pointer-glow {

                    category: "C Programming",
                    description: "A C-based command-line system for entering patient information, selecting a doctor, reviewing fees and available slots, choosing a date and time, and confirming a booking.",
                    longDescription: "This current version is a C command-line application. It supports patient information, doctor selection, fee and available-slot display, date and time selection, and booking confirmation. It does not currently include a database, login, admin panel, web backend, or online payments.",
                    technologies: ["C (Learning/Using)", "Command Line"],
                    github: "https://github.com/sivaganeshdegala-sketch",
                    live: "",
                    image: "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=900&q=80"
                }
            ],
            certifications: []
        };

        function mapProject(row) {
            const technologies = Array.isArray(row.technologies)
                ? row.technologies
                : (typeof row.technologies === "string" ? row.technologies.split(",").map(item => item.trim()).filter(Boolean) : []);
            return {
                id: row.id,
                title: row.title || "Untitled project",
                category: row.category || "Project",
                description: row.description || "",
                longDescription: row.long_description || row.description || "",
                technologies,
                github: row.github_url || "",
                live: row.live_url || "",
                image: row.image_url || "",
                isFeatured: Boolean(row.featured),
                isPublished: Boolean(row.published)
            };
        }

        function App() {
            const [portfolioData, setPortfolioData] = useState(DEFAULT_DATA);
            const [codingStats, setCodingStats] = useState(null);
            const [codingStatsMessage, setCodingStatsMessage] = useState("Loading public coding profiles…");
            const [showIntro, setShowIntro] = useState(() => !window.matchMedia("(prefers-reduced-motion: reduce)").matches);
            const [projects, setProjects] = useState(supabaseClient ? [] : DEFAULT_DATA.projects);
            const [projectsLoading, setProjectsLoading] = useState(Boolean(supabaseClient));
            const [projectsError, setProjectsError] = useState("");
            const [session, setSession] = useState(null);
            const [roleIndex, setRoleIndex] = useState(0);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [activeProjectModal, setActiveProjectModal] = useState(null);
            const [toastMessage, setToastMessage] = useState("");
            const [activeSection, setActiveSection] = useState("about");
            const [adminLoginOpen, setAdminLoginOpen] = useState(false);
            const [adminDashboardOpen, setAdminDashboardOpen] = useState(false);
            const isAdmin = session?.user?.email?.toLowerCase() === ADMIN_EMAIL;

            useEffect(() => {
                if (!window.matchMedia("(pointer: fine)").matches) return;

                const previousBodyCursor = document.body.style.cursor;
                document.body.style.setProperty("cursor", "none", "important");

                const cursorDot = document.createElement("div");
                const cursorOutline = document.createElement("div");
                cursorDot.className = "portfolio-cursor portfolio-cursor-dot";
                cursorOutline.className = "portfolio-cursor portfolio-cursor-outline";
                cursorDot.setAttribute("aria-hidden", "true");
                cursorOutline.setAttribute("aria-hidden", "true");
                document.body.append(cursorDot, cursorOutline);

                const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
                let hoveringInteractive = false;
                let hasCursorPosition = false;

                const moveCursor = (element, x, y) => {
                    element.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%, -50%)`;
                };

                const handlePointerMove = (event) => {
                    if (event.pointerType === "touch") return;
                    const firstMove = !hasCursorPosition;
                    hasCursorPosition = true;
                    if (firstMove) cursorOutline.style.transitionDuration = "0s";
                    moveCursor(cursorDot, event.clientX, event.clientY);
                    moveCursor(cursorOutline, event.clientX, event.clientY);
                    cursorDot.classList.add("is-visible");
                    cursorOutline.classList.add("is-visible");
                    const target = event.target instanceof Element
                        ? event.target.closest("a,button,[role='button'],[tabindex]:not([tabindex='-1']),input,textarea,select,summary,img,.cursor-pointer,.group,[onclick],[data-cursor-hover]")
                        : null;
                    const nextHoveringInteractive = Boolean(target);
                    if (nextHoveringInteractive !== hoveringInteractive) {
                        cursorDot.classList.toggle("is-hovered", nextHoveringInteractive);
                        cursorOutline.classList.toggle("is-hovered", nextHoveringInteractive);
                        hoveringInteractive = nextHoveringInteractive;
                    }
                    cursorOutline.style.transitionDuration = reducedMotion.matches || firstMove ? "0s" : "0.14s";
                };

                const handlePointerDown = () => {
                    cursorDot.classList.add("is-pressed");
                    cursorOutline.classList.add("is-pressed");
                };
                const handlePointerUp = () => {
                    cursorDot.classList.remove("is-pressed");
                    cursorOutline.classList.remove("is-pressed");
                };
                const handlePointerLeave = () => {
                    cursorDot.classList.remove("is-visible", "is-hovered", "is-pressed");
                    cursorOutline.classList.remove("is-visible", "is-hovered", "is-pressed");
                    hoveringInteractive = false;
                };

                window.addEventListener("pointermove", handlePointerMove, { passive: true });
                window.addEventListener("pointerdown", handlePointerDown, { passive: true });
                window.addEventListener("pointerup", handlePointerUp, { passive: true });
                window.addEventListener("pointercancel", handlePointerUp, { passive: true });
                document.addEventListener("pointerleave", handlePointerLeave);
                window.addEventListener("blur", handlePointerLeave);

                return () => {
                    window.removeEventListener("pointermove", handlePointerMove);
                    window.removeEventListener("pointerdown", handlePointerDown);
                    window.removeEventListener("pointerup", handlePointerUp);
                    window.removeEventListener("pointercancel", handlePointerUp);
                    document.removeEventListener("pointerleave", handlePointerLeave);
                    window.removeEventListener("blur", handlePointerLeave);
                    cursorDot.remove();
                    cursorOutline.remove();
                    if (previousBodyCursor) document.body.style.setProperty("cursor", previousBodyCursor);
                    else document.body.style.removeProperty("cursor");
                };
            }, []);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(""), 4000);
            };

            const openAdminRoute = () => {
                if (window.location.hash !== "#admin") window.location.hash = "admin";
                else if (isAdmin) setAdminDashboardOpen(true);
                else setAdminLoginOpen(true);
            };

            const closeAdminRoute = () => {
                setAdminLoginOpen(false);
                setAdminDashboardOpen(false);
                if (/\/admin\/?$/.test(window.location.pathname)) {
                    window.history.replaceState({}, "", window.location.pathname.replace(/admin\/?$/, "") || "/");
                } else if (window.location.hash === "#admin") {
                    window.location.hash = "about";
                }
            };

            useEffect(() => {
                const syncAdminRoute = () => {
                    if (window.location.hash === "#admin" || /\/admin\/?$/.test(window.location.pathname)) {
                        setAdminLoginOpen(!isAdmin);
                        setAdminDashboardOpen(isAdmin);
                    }
                };
                syncAdminRoute();
                window.addEventListener("hashchange", syncAdminRoute);
                return () => window.removeEventListener("hashchange", syncAdminRoute);
            }, [isAdmin]);

            useEffect(() => {
                if (mobileMenuOpen || activeProjectModal || adminLoginOpen || adminDashboardOpen) {
                    document.body.style.overflow = "hidden";
                } else {
                    document.body.style.overflow = "unset";
                }
            }, [mobileMenuOpen, activeProjectModal, adminLoginOpen, adminDashboardOpen]);

            useEffect(() => {
                if (!supabaseClient) return;
                let alive = true;
                supabaseClient.from("projects").select("*").eq("published", true)
                    .order("featured", { ascending: false }).order("created_at", { ascending: false })
                    .then(({ data, error }) => {
                        if (!alive) return;
                        if (error) setProjectsError("Projects could not be loaded. Check the Supabase table and RLS setup.");
                        else setProjects((data || []).map(mapProject));
                        setProjectsLoading(false);
                    });
                supabaseClient.from("portfolio_profile").select("data").eq("id", "main").maybeSingle()
                    .then(({ data, error }) => {
                    if (alive && !error && data?.data) setPortfolioData(current => ({ ...current, personal: { ...current.personal, ...data.data, hackerrank: HACKERRANK_PROFILE_URL } }));
                    });
                supabaseClient.auth.getSession().then(({ data }) => {
                    if (alive && data.session?.user?.email?.toLowerCase() === ADMIN_EMAIL) setSession(data.session);
                });
                const { data: authListener } = supabaseClient.auth.onAuthStateChange((_event, nextSession) => {
                    if (nextSession?.user?.email?.toLowerCase() === ADMIN_EMAIL) setSession(nextSession);
                    else setSession(null);
                });
                return () => {
                    alive = false;
                    authListener.subscription.unsubscribe();
                };
            }, []);

            useEffect(() => {
                if (!supabaseClient) return;
                let alive = true;
                const syncCodingStats = async () => {
                    try {
                        const { data, error } = await supabaseClient.functions.invoke("coding-stats");
                        if (!alive) return;
                        if (error || !data) {
                            setCodingStatsMessage("Stats sync is unavailable; checking again in 5 minutes.");
                            return;
                        }
                        setCodingStats(data);
                        const allAvailable = data.leetcode?.status === "ok" && data.hackerrank?.status === "ok";
                        setCodingStatsMessage(allAvailable
                            ? "Synced from public profiles · checks again in 5 minutes"
                            : "A profile count is temporarily unavailable · checking again in 5 minutes");
                    } catch {
                        if (alive) setCodingStatsMessage("Stats sync is unavailable; checking again in 5 minutes.");
                    }
                };
                syncCodingStats();
                const timer = window.setInterval(syncCodingStats, 5 * 60 * 1000);
                return () => {
                    alive = false;
                    window.clearInterval(timer);
                };
            }, []);

            useEffect(() => {
                const timer = setInterval(() => {
                    setRoleIndex((prev) => (prev + 1) % portfolioData.personal.roles.length);
                }, 3200);
                return () => clearInterval(timer);
            }, [portfolioData.personal.roles.length]);

            useEffect(() => {
                const sections = document.querySelectorAll("section[id]");
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            setActiveSection(entry.target.id);
                        }
                    });
                }, { threshold: 0.3 });

                const motionTargets = document.querySelectorAll(".motion-reveal");
                const motionObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add("motion-visible");
                            motionObserver.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.12, rootMargin: "0px 0px -48px 0px" });

                sections.forEach(sec => observer.observe(sec));
                motionTargets.forEach(target => motionObserver.observe(target));
                return () => { observer.disconnect(); motionObserver.disconnect(); };
            }, []);useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === "Escape") {
                        setActiveProjectModal(null);
                        setMobileMenuOpen(false);
                        closeAdminRoute();
                    }
                    if (e.ctrlKey && e.shiftKey && e.key === 'A') {
                        openAdminRoute();
                    }
                };
                window.addEventListener("keydown", handleKeyDown);
                return () => window.removeEventListener("keydown", handleKeyDown);
            }, [isAdmin]);

            const handleContactSubmit = async (msgData) => {
                if (!supabaseClient) throw new Error("Contact form is not configured yet.");
                const { error } = await supabaseClient.from("messages").insert({
                    name: msgData.name.trim(),
                    email: msgData.email.trim(),
                    message: msgData.message.trim()
                });
                if (error) throw error;
                try {
                    const { data, error: notificationError } = await supabaseClient.functions.invoke("contact-notification", {
                        body: {
                            name: msgData.name.trim(),
                            email: msgData.email.trim(),
                            message: msgData.message.trim()
                        }
                    });
                    return { notificationSent: !notificationError && data?.sent === true };
                } catch {
                    return { notificationSent: false };
                }
            };

            const handleLogin = async (email, password) => {
                if (!supabaseClient) throw new Error("Supabase is not configured.");
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;
                if (data.user?.email?.toLowerCase() !== ADMIN_EMAIL) {
                    await supabaseClient.auth.signOut();
                    throw new Error("This account is not authorized for portfolio administration.");
                }
                setSession(data.session);
                setAdminLoginOpen(false);
                setAdminDashboardOpen(true);
            };

            const handleSaveProfile = async (personal) => {
                const { error } = await supabaseClient.from("portfolio_profile").upsert({ id: "main", data: personal });
                if (error) throw error;
                setPortfolioData(current => ({ ...current, personal }));
            };

            return (
                <div className={`min-h-screen relative bg-[#070707] text-neutral-100 font-grotesk overflow-x-hidden selection:bg-white selection:text-black ${showIntro ? "" : "portfolio-enter"}`}>
                    {showIntro && (
                        <div className="name-intro" role="status" aria-label="Welcome to Siva Degala's portfolio"
                            onAnimationEnd={(event) => { if (event.target === event.currentTarget && event.animationName === "nameIntroExit") setShowIntro(false); }}>
                            <div className="name-intro-glow name-intro-glow--left" aria-hidden="true"></div>
                            <div className="name-intro-glow name-intro-glow--right" aria-hidden="true"></div>
                            <div className="name-intro-orbit" aria-hidden="true"><span></span><span></span><span></span></div>
                            <div className="name-intro-content">
                                <span className="name-intro-kicker">PORTFOLIO</span>
                                <h2 className="name-intro-title">Siva Degala</h2>
                                <span className="name-intro-rule" aria-hidden="true"></span>
                                <p className="name-intro-caption">ARTIFICIAL DATA SCIENCE ENGINEER</p>
                            </div>
                        </div>
                    )}
                    <Navbar
                        name={portfolioData.personal.name}
                        mobileMenuOpen={mobileMenuOpen}
                        setMobileMenuOpen={setMobileMenuOpen}
                        activeSection={activeSection}
                    />

                    <HeroSection
                        personal={portfolioData.personal}
                        currentRole={portfolioData.personal.roles[roleIndex]}
                        roleIndex={roleIndex}
                        setRoleIndex={setRoleIndex}
                        rolesCount={portfolioData.personal.roles.length}
                    />

                    <div className="portfolio-ribbon" aria-label="Areas of interest">
                        <div className="portfolio-ribbon-track">
                            {Array.from({ length: 2 }).map((_, i) => (
                                <span key={i}>AI & DATA SCIENCE <b>✳</b> SOFTWARE DEVELOPMENT <b>✳</b> CREATIVE PROJECTS <b>✳</b> ALWAYS LEARNING <b>✳</b></span>
                            ))}
                        </div>
                    </div>

                    <AboutSection
                        personal={portfolioData.personal}
                        codingStats={codingStats}
                        codingStatsMessage={codingStatsMessage}
                        onCopyEmail={() => {
                            copyToClipboard(portfolioData.personal.email, () => showToast("Email copied to clipboard!"));
                        }}
                    />

                    <SkillsSection skills={portfolioData.skills} />

                    <ProjectsSection
                        projects={projects}
                        loading={projectsLoading}
                        error={projectsError}
                        onOpenProject={(proj) => setActiveProjectModal(proj)}
                    />

                    <CertificationsSection
                        certs={portfolioData.certifications}
                        onVerify={(c) => showToast(`Credential Verified: ${c.credentialId}`)}
                    />

                    <ContactSection
                        personal={portfolioData.personal}
                        onSubmit={handleContactSubmit}
                        onCopyEmail={() => {
                            copyToClipboard(portfolioData.personal.email, () => showToast("Email copied to clipboard!"));
                        }}
                    />

                    <Footer
                        name={portfolioData.personal.name}
                        personal={portfolioData.personal}
                        onAdminClick={openAdminRoute}
                    />

                    {activeProjectModal && (
                        <ProjectDetailModal
                            project={activeProjectModal}
                            onClose={() => setActiveProjectModal(null)}
                        />
                    )}

                    {/* Admin Portals */}
                    {adminLoginOpen && (
                        <AdminLoginModal
                            onClose={closeAdminRoute}
                            onLogin={handleLogin}
                        />
                    )}
                    {adminDashboardOpen && isAdmin && (
                        <AdminDashboardModal
                            client={supabaseClient}
                            personal={portfolioData.personal}
                            onSaveProfile={handleSaveProfile}
                            onClose={closeAdminRoute}
                            onLogout={async () => {
                                closeAdminRoute();
                                await supabaseClient.auth.signOut();
                                setSession(null);
                                setAdminDashboardOpen(false);
                                showToast("Signed out.");
                            }}
                            showToast={showToast}
                        />
                    )}

                    {toastMessage && <Toast message={toastMessage} onClose={() => setToastMessage("")} />}
                </div>
            );
        }

        // --- COMPONENTS ---

        function Navbar({ name, mobileMenuOpen, setMobileMenuOpen, activeSection }) {
            const navLinks = [
                { id: "about", label: "About" },
                { id: "skills", label: "Toolkit" },
                { id: "projects", label: "Work" },
                { id: "contact", label: "Connect" },
            ];

            const brandName = "Siva Degala";

            return (
                <header className="fixed top-0 left-0 right-0 z-50 px-4 sm:px-8 py-5">
                    <div className="max-w-7xl mx-auto flex items-center justify-between">
                        <a href="#" className="font-syne font-extrabold text-xl sm:text-2xl tracking-tight text-white hover:opacity-80 transition-opacity">
                            {brandName}<span className="text-neutral-500">.</span>
                        </a>

                        <nav className="hidden md:flex items-center space-x-1 px-4 py-2 rounded-full bg-neutral-900/90 backdrop-blur-md border border-neutral-800/80 text-xs font-mono tracking-wider uppercase text-neutral-400 shadow-2xl">
                            {navLinks.map((link) => (
                                <a key={link.id} href={`#${link.id}`}
                                    className={`px-3 py-1.5 rounded-full transition-all duration-300 ${activeSection === link.id ? "bg-white text-black font-bold shadow-sm" : "hover:text-white hover:bg-neutral-800/50"}`}>
                                    {link.label}

                            ))}
                        </nav>

                        <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="md:hidden p-3 rounded-full bg-neutral-900 border border-neutral-800 text-white font-mono text-sm">
                            {mobileMenuOpen ? '✕' : '☰'}
                        </button>
                    </div>

                    {mobileMenuOpen && (
                        <div className="md:hidden mt-3 rounded-2xl bg-neutral-950/95 backdrop-blur-xl border border-neutral-800 p-6 space-y-4 text-center font-mono text-xs uppercase tracking-widest text-neutral-300 shadow-2xl animate-toast">
                            {navLinks.map((link) => (
                                <a key={link.id} href={`#${link.id}`} onClick={()=>setMobileMenuOpen(false)}
                                    className={`block py-2.5 rounded-xl transition-colors ${activeSection === link.id ? "bg-white/10 text-white font-bold" : "hover:text-white hover:bg-neutral-900"}`}>
                                    {link.label}
                                </a>
                            ))}
                        </div>
                    )}
                </header>
            );
        }

        function HeroSection({ personal, currentRole, roleIndex, setRoleIndex, rolesCount }) {
            return (
                <section className="hero-composition relative min-h-screen pt-32 pb-16 flex flex-col justify-between px-4 sm:px-8 max-w-7xl mx-auto overflow-hidden"
                    onMouseMove={(e) => {
                        const rect = e.currentTarget.getBoundingClientRect();
                        e.currentTarget.style.setProperty('--pointer-x', `${((e.clientX - rect.left) / rect.width) * 100}%`);
                        e.currentTarget.style.setProperty('--pointer-y', `${((e.clientY - rect.top) / rect.height) * 100}%`);
                    }}>
                    <div className="hero-pointer-glow" aria-hidden="true"></div>
                    <div className="absolute top-1/4 left-1/4 w-72 h-72 bg-violet-500/15 rounded-full blur-[130px] pointer-events-none"></div>
                    <div className="absolute bottom-1/4 right-0 w-80 h-80 bg-indigo-500/10 rounded-full blur-[150px] pointer-events-none"></div>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-16 items-center relative z-10 my-auto py-10">
                        <div className="lg:col-span-5 flex justify-center lg:justify-start relative hero-stage">
                            <div className="absolute -inset-8 bg-violet-500/15 rounded-[3rem] blur-3xl"></div>
                            <div aria-hidden="true" className="absolute left-1 top-2 w-64 h-80 sm:w-80 sm:h-[25rem] rounded-[2rem] border border-violet-200/30 bg-gradient-to-br from-violet-300/60 via-indigo-800/70 to-[#111322] shadow-[18px_20px_45px_rgba(100,80,255,0.32)] translate-x-4 translate-y-4 rotate-[4deg]"></div>
                            <div className="relative hero-photo-card w-64 h-80 sm:w-80 sm:h-[25rem] rounded-[2rem] border border-white/15 bg-[#111322] group"
                                onMouseMove={(e) => {
                                    const rect = e.currentTarget.getBoundingClientRect();
                                    const x = (e.clientX - rect.left) / rect.width;
                                    const y = (e.clientY - rect.top) / rect.height;
                                    e.currentTarget.style.setProperty('--tilt-y', `${(x - 0.5) * 12}deg`);
                                    e.currentTarget.style.setProperty('--tilt-x', `${(0.5 - y) * 10}deg`);
                                    e.currentTarget.style.setProperty('--image-x', `${(0.5 - x) * 13}px`);
                                    e.currentTarget.style.setProperty('--image-y', `${(0.5 - y) * 13}px`);
                                    e.currentTarget.style.setProperty('--light-x', `${x * 100}%`);
                                    e.currentTarget.style.setProperty('--light-y', `${y * 100}%`);
                                }}
                                onMouseLeave={(e) => {
                                    e.currentTarget.style.setProperty('--tilt-x', '0deg');
                                    e.currentTarget.style.setProperty('--tilt-y', '0deg');
                                    e.currentTarget.style.setProperty('--image-x', '0px');
                                    e.currentTarget.style.setProperty('--image-y', '0px');
                                    e.currentTarget.style.setProperty('--light-x', '50%');
                                    e.currentTarget.style.setProperty('--light-y', '40%');
                                }}>
                                <div className="hero-photo-window">
                                    <img src={personal.image} alt={personal.name} loading="lazy"
                                        className="hero-depth-image w-full h-full object-cover contrast-105"
                                        onError={(e) => { e.target.onerror = null; e.target.src = FALLBACK_PROFILE; }} />
                                    <div className="hero-photo-overlay absolute inset-0 bg-gradient-to-t from-[#090b18] via-transparent to-[#111322]/10"></div>
                                    <div className="hero-photo-overlay absolute inset-x-0 bottom-0 h-28 bg-gradient-to-t from-violet-950/55 to-transparent"></div>
                                </div>
                                <div className="hero-photo-label absolute bottom-4 left-4 right-4 p-3.5 rounded-2xl bg-[#0b0d1a]/85 backdrop-blur-xl border border-white/10 text-[11px] font-mono flex items-center justify-between">
                                    <span className="flex items-center space-x-2">
                                        <span className="w-2 h-2 rounded-full bg-violet-300 animate-pulse"></span>
                                        <span className="text-neutral-200">B.TECH STUDENT</span>
                                    </span>
                                    <span className="text-violet-200/80 truncate max-w-[110px]">AI & DATA SCIENCE</span>
                                </div>
                                <div className="hero-photo-glass"></div>
                            </div>
                            <div className="hero-float-tag hero-float-tag--location absolute -left-1 sm:-left-3 top-2 px-4 py-3 rounded-2xl bg-[#131629]/90 backdrop-blur-xl border border-white/10 shadow-xl text-[10px] sm:text-xs font-mono text-neutral-200">
                                {personal.location.split(',')[0]} · INDIA
                            </div>
                            <div className="hero-float-tag hero-float-tag--year absolute right-0 sm:right-2 bottom-2 px-4 py-3 rounded-2xl backdrop-blur-xl shadow-xl text-[10px] sm:text-xs font-mono">
                                2ND YEAR · B.TECH
                            </div>
                        </div>

                        <div className="lg:col-span-7 space-y-7 text-center lg:text-left">
                            <div className="flex items-center justify-center lg:justify-start gap-3">
                                <span className="w-8 h-px bg-violet-300"></span>
                                <span className="text-xs font-mono uppercase tracking-[0.25em] text-violet-200">{personal.tagline}</span>
                            </div>

                            <div>
                                <p className="font-mono text-sm sm:text-base text-neutral-400 mb-2">Hello, I’m</p>
                                <h1 className="font-syne font-extrabold text-4xl sm:text-6xl lg:text-6xl xl:text-7xl text-white tracking-tight leading-[0.9] uppercase">
                                    <span className="block">Siva</span>
                                    <span className="block bg-gradient-to-r from-violet-200 via-white to-indigo-300 bg-clip-text text-transparent">Degala<span className="text-violet-300">.</span></span>
                                </h1>
                            </div>

                            <div className="flex items-center justify-center lg:justify-start gap-3 min-h-8">
                                <span key={currentRole} className="headline-fade-enter text-sm sm:text-base text-violet-100 font-medium">{currentRole}</span>

                        </div>
                    </div>
                </footer>
            );
        }

        // --- MODALS ---

        function ProjectDetailModal({ project, onClose }) {
            return (
                <div onClick={onClose} role="dialog" className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md animate-toast">
                    <div onClick={(e) => e.stopPropagation()} className="bg-neutral-900 border border-neutral-800 max-w-2xl w-full rounded-3xl p-6 sm:p-8 space-y-6 max-h-[90vh] overflow-y-auto shadow-2xl">
                        <div className="flex items-center justify-between border-b border-neutral-800 pb-4">
                            <div>
                                <span className="text-[10px] font-mono text-neutral-500 uppercase">// {project.category}</span>
                                <h3 className="font-syne font-bold text-2xl text-white">{project.title}</h3>
                            </div>
                            <button onClick={onClose} className="text-neutral-400 hover:text-white font-mono text-sm p-1">✕</button>
                        </div>
                        <div className="rounded-2xl overflow-hidden border border-neutral-800">
                            <img src={project.image} alt={project.title} className="w-full h-56 object-cover filter grayscale" onError={(e)=>{ e.target.onerror = null; e.target.src = FALLBACK_PROJECT; }}/>
                        </div>
                        <div className="space-y-4">
                            <h4 className="text-xs font-mono text-neutral-400 uppercase tracking-widest">// OVERVIEW</h4>
                            <p className="text-sm text-neutral-300 font-light leading-relaxed">{project.longDescription || project.description}</p>
                            <div className="flex flex-wrap gap-2 pt-2">
                                {project.technologies.map(t => <span key={t} className="text-[10px] font-mono px-3 py-1 rounded-md bg-neutral-950 border border-neutral-800 text-neutral-300">{t}</span>)}
                            </div>
                        </div>
                        <div className="pt-4 flex justify-between items-center border-t border-neutral-800">
                            <button onClick={onClose} className="px-5 py-2 rounded-full border border-neutral-800 text-xs font-mono text-neutral-400 hover:text-white">Back</button>
                            <div className="flex gap-3">
                                {project.live && <a href={project.live} target="_blank" rel="noopener noreferrer" className="px-5 py-2 rounded-full border border-neutral-700 text-white font-mono text-xs hover:border-white">Live Project ↗</a>}
                                {project.github && <a href={project.github} target="_blank" rel="noopener noreferrer" className="px-6 py-2 rounded-full bg-white text-black font-mono font-bold text-xs hover:bg-neutral-200">Source Code ↗</a>}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- ADMIN SYSTEM IMPLEMENTATION ---

        function AdminLoginModal({ onClose, onLogin }) {
            const [pass, setPass] = useState('');
            const [err, setErr] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);
            const handleLogin = async (e) => {
                e.preventDefault();
                setErr('');
                setIsSubmitting(true);
                try {
                    await onLogin(ADMIN_EMAIL, pass);
                } catch (error) {
                    setErr(error.message || "Authentication failed.");
                } finally {
                    setIsSubmitting(false);
                }
            };
            return (
                <div onClick={onClose} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md animate-toast">
                    <div onClick={e => e.stopPropagation()} className="bg-[#0a0a0a] border border-neutral-800 max-w-sm w-full rounded-2xl p-8 space-y-6">
                        <h3 className="font-syne font-bold text-2xl text-white text-center">Admin Access</h3>
                        <form onSubmit={handleLogin} className="space-y-4">
                            <div>
                                <p className="text-xs text-neutral-400 text-center">{ADMIN_EMAIL}</p>
                                <input type="password" placeholder="Supabase password" value={pass} onChange={e=>setPass(e.target.value)} autoFocus required
                                    className="w-full px-5 py-3 rounded-xl bg-neutral-900 border border-neutral-800 text-center text-white text-sm focus:outline-none focus:border-white" />
                                {err && <p className="text-red-400 text-xs mt-2 text-center">{err}</p>}
                            </div>
                            <button type="submit" disabled={isSubmitting} className="w-full py-3 rounded-xl bg-white text-black font-mono font-bold text-xs uppercase tracking-widest hover:bg-neutral-200 disabled:opacity-50">{isSubmitting ? "Authenticating..." : "Authenticate"}</button>
                        </form>
                    </div>
                </div>
            );
        }

        function AdminDashboardModal({ client, personal, onSaveProfile, onClose, onLogout, showToast }) {
            const [tab, setTab] = useState('profile');
            const [profile, setProfile] = useState(personal);
            const [projects, setProjects] = useState([]);
            const [messages, setMessages] = useState([]);
            const [loadError, setLoadError] = useState("");
            const [projectForm, setProjectForm] = useState(null);
            const [saving, setSaving] = useState(false);

            const loadAdminData = async () => {
                const [projectResult, messageResult] = await Promise.all([
                    client.from("projects").select("*").order("created_at", { ascending: false }),
                    client.from("messages").select("*").order("created_at", { ascending: false })
                ]);
                if (projectResult.error || messageResult.error) {
                    setLoadError("Could not load admin data. Confirm the admin RLS policies are installed.");
                    return;
                }
                setProjects((projectResult.data || []).map(mapProject));
                setMessages(messageResult.data || []);
            };

            useEffect(() => { loadAdminData(); }, []);

            const saveProfile = async () => {
                setSaving(true);
                try {
                    await onSaveProfile(profile);
                    showToast("Profile saved to Supabase.");
                } catch (error) {
                    showToast(error.message || "Profile could not be saved.");
                } finally { setSaving(false); }
            };

            const saveProject = async (event) => {
                event.preventDefault();
                setSaving(true);
                const row = {
                    title: projectForm.title.trim(),
                    description: projectForm.description.trim(),
                    technologies: projectForm.technologies.split(",").map(item => item.trim()).filter(Boolean),
                    github_url: projectForm.github.trim() || null,
                    live_url: projectForm.live.trim() || null,
                    image_url: projectForm.image.trim() || null,
                    published: projectForm.isPublished,
                    featured: projectForm.isFeatured
                };
                if (projectForm.id) row.id = projectForm.id;
                const result = projectForm.id
                    ? await client.from("projects").update(row).eq("id", projectForm.id)
                    : await client.from("projects").insert(row);
                const { error } = result;
                setSaving(false);
                if (error) { showToast(error.message); return; }
                setProjectForm(null);
                await loadAdminData();
                showToast("Project saved.");
            };

            const toggleProject = async (project, field) => {
                const column = field === "isPublished" ? "published" : "featured";
                const { error } = await client.from("projects").update({ [column]: !project[field] }).eq("id", project.id);
                if (error) showToast(error.message);
                else { await loadAdminData(); showToast("Project updated."); }
            };

            const deleteProject = async (project) => {
                if (!confirm(`Delete ${project.title}?`)) return;
                const { error } = await client.from("projects").delete().eq("id", project.id);
                if (error) showToast(error.message);
                else { await loadAdminData(); showToast("Project deleted."); }
            };

            const deleteMessage = async (message) => {
                if (!confirm("Delete this contact message?")) return;
                const { error } = await client.from("messages").delete().eq("id", message.id);
                if (error) showToast(error.message);
                else { await loadAdminData(); showToast("Message deleted."); }
            };

            const emptyProject = {
                id: "", title: "", description: "", technologies: "",
                github: "", live: "", image: "", isPublished: false, isFeatured: false
            };

            return (
                <div className="fixed inset-0 z-[100] bg-[#070707] flex flex-col font-mono text-sm animate-toast overflow-hidden">
                    {/* Admin Header */}
                    <header className="px-6 py-4 border-b border-neutral-800 flex justify-between items-center bg-neutral-950">
                        <div className="flex items-center space-x-4">
                            <span className="text-white font-syne font-bold text-xl">System Admin Dashboard</span>
                            <span className="px-2 py-1 rounded bg-emerald-900/50 text-emerald-400 text-[10px] border border-emerald-800">SUPABASE</span>
                        </div>
                        <div className="flex space-x-3">
                            <button onClick={onLogout} className="px-4 py-2 rounded border border-neutral-700 text-neutral-300 hover:text-white text-xs">Logout</button>
                            <button onClick={onClose} className="px-4 py-2 rounded bg-white text-black font-bold text-xs">Close Dashboard</button>
                        </div>
                    </header>

                    <div className="flex flex-1 overflow-hidden">
                        {/* Sidebar Tabs */}
                        <div className="w-64 border-r border-neutral-800 bg-neutral-900/30 p-4 space-y-2">
                                    {['profile', 'messages', 'projects'].map(t => (
                                <button key={t} onClick={() => setTab(t)}
                                    className={`w-full text-left px-4 py-3 rounded-lg uppercase tracking-wider text-xs transition-colors ${tab === t ? 'bg-neutral-800 text-white font-bold' : 'text-neutral-500 hover:bg-neutral-800/50 hover:text-neutral-300'}`}>
                                            {t} {t === 'messages' && `(${messages.length})`}
                                </button>
                            ))}
                        </div>

                        {/* Content Area */}
                        <div className="flex-1 overflow-y-auto p-8 bg-[#0a0a0a]">
                            {loadError && <p role="alert" className="text-red-400 text-sm mb-6">{loadError}</p>}
                            {tab === 'profile' && (
                                <div className="max-w-2xl space-y-6">
                                    <h2 className="text-white font-syne text-2xl mb-6">Edit Profile Data</h2>
                                    <div className="space-y-4">
                                        {['name', 'tagline', 'bio', 'status', 'degree', 'college', 'graduation', 'location', 'email', 'phone', 'github', 'linkedin', 'instagram', 'leetcode', 'hackerrank', 'image'].map(key => (
                                            <div key={key} className="flex flex-col">
                                                <label className="text-xs text-neutral-500 uppercase mb-1">{key}</label>
                                                {key === 'bio' ? (
                                                    <textarea rows="4" className="bg-neutral-900 border border-neutral-800 text-white p-3 rounded focus:border-neutral-500"
                                                        value={profile[key] || ''} onChange={e => setProfile({...profile, [key]: e.target.value})} />
                                                ) : (
                                                    <input type="text" className="bg-neutral-900 border border-neutral-800 text-white p-3 rounded focus:border-neutral-500"
                                                        value={profile[key] || ''} onChange={e => setProfile({...profile, [key]: e.target.value})} />
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={saveProfile} disabled={saving} className="px-5 py-3 rounded-lg bg-white text-black font-bold text-xs disabled:opacity-50">{saving ? "Saving..." : "Save Profile"}</button>
                                </div>
                            )}

                            {tab === 'messages' && (
                                <div className="space-y-4">
                                    <h2 className="text-white font-syne text-2xl mb-6">Database: Contact Form Inquiries</h2>
                                    {messages.length === 0 ? (
                                        <p className="text-neutral-500">No messages found.</p>
                                    ) : (
                                        messages.map(m => (
                                            <div key={m.id} className="p-5 rounded-xl border border-neutral-800 bg-neutral-900 space-y-3 relative group">
                                                <button onClick={() => deleteMessage(m)} className="absolute top-4 right-4 text-neutral-600 hover:text-red-400">Delete</button>
                                                <div className="flex gap-4 text-xs text-neutral-500">
                                                    <span className="text-neutral-300">{m.name}</span>
                                                    <span>{m.email}</span>
                                                    <span>{new Date(m.created_at).toLocaleString()}</span>
                                                </div>
                                                <p className="text-white text-base font-sans">{m.message}</p>
                                            </div>
                                        ))
                                    )}
                                </div>
                            )}

                            {tab === 'projects' && (
                                <div className="space-y-6">
                                    <div className="flex items-center justify-between gap-4">
                                        <h2 className="text-white font-syne text-2xl">Manage Projects</h2>
                                        <button onClick={() => setProjectForm({ ...emptyProject })} className="px-4 py-2 rounded bg-white text-black text-xs font-bold">Add Project</button>
                                    </div>
                                    {projectForm && (
                                        <form onSubmit={saveProject} className="grid grid-cols-1 md:grid-cols-2 gap-3 p-5 border border-neutral-800 rounded bg-neutral-900">
                                            {[['title','Title'],['description','Description'],['technologies','Technologies (comma separated)'],['github','GitHub URL'],['live','Live URL'],['image','Image URL']].map(([key,label]) => (
                                                <label key={key} className="text-xs text-neutral-500">{label}
                                                    {['description','longDescription'].includes(key)
                                                        ? <textarea required rows="3" value={projectForm[key]} onChange={event => setProjectForm({ ...projectForm, [key]: event.target.value })} className="mt-1 w-full bg-neutral-950 border border-neutral-800 text-white p-3 rounded" />
                                                        : <input required={key === 'title'} type="text" value={projectForm[key]} onChange={event => setProjectForm({ ...projectForm, [key]: event.target.value })} className="mt-1 w-full bg-neutral-950 border border-neutral-800 text-white p-3 rounded" />}
                                                </label>
                                            ))}
                                            <label className="flex items-center gap-2 text-xs text-neutral-300"><input type="checkbox" checked={projectForm.isPublished} onChange={event => setProjectForm({ ...projectForm, isPublished: event.target.checked })} /> Published</label>
                                            <label className="flex items-center gap-2 text-xs text-neutral-300"><input type="checkbox" checked={projectForm.isFeatured} onChange={event => setProjectForm({ ...projectForm, isFeatured: event.target.checked })} /> Featured</label>
                                            <div className="md:col-span-2 flex gap-3">
                                                <button disabled={saving} className="px-4 py-2 rounded bg-white text-black text-xs font-bold">{saving ? "Saving..." : "Save Project"}</button>
                                                <button type="button" onClick={() => setProjectForm(null)} className="px-4 py-2 rounded border border-neutral-700 text-xs">Cancel</button>
                                            </div>
                                        </form>
                                    )}
                                    {projects.length === 0 && <p className="text-neutral-500">No projects in the database.</p>}
                                    {projects.map(project => (
                                            <div key={project.id} className="p-4 border border-neutral-800 rounded bg-neutral-900 flex flex-wrap items-center justify-between gap-4">
                                            <div><h4 className="text-white font-bold">{project.title}</h4><p className="text-neutral-500 text-xs">{project.category} · {project.isPublished ? "Published" : "Draft"} · {project.isFeatured ? "Featured" : "Not featured"}</p></div>
                                            <div className="flex flex-wrap gap-2">
                                                <button onClick={() => setProjectForm({ ...project, technologies: project.technologies.join(", ") })} className="px-3 py-2 border border-neutral-700 rounded text-xs">Edit</button>
                                                <button onClick={() => toggleProject(project, "isPublished")} className="px-3 py-2 border border-neutral-700 rounded text-xs">{project.isPublished ? "Unpublish" : "Publish"}</button>
                                                <button onClick={() => toggleProject(project, "isFeatured")} className="px-3 py-2 border border-neutral-700 rounded text-xs">{project.isFeatured ? "Unfeature" : "Feature"}</button>
                                                <button onClick={() => deleteProject(project)} className="px-3 py-2 border border-red-900 text-red-400 rounded text-xs">Delete</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function Toast({ message, onClose }) {
            return (
                <div className="fixed bottom-6 right-6 z-[200] px-5 py-3 rounded-2xl bg-white text-black font-mono text-xs font-bold shadow-2xl flex items-center space-x-3 animate-toast border border-neutral-200">
                    <span>✓</span>
                    <span>{message}</span>
                    <button onClick={onClose} className="ml-2 text-neutral-500 hover:text-black">✕</button>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
