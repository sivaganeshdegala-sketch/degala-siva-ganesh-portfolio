<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO & OpenGraph Meta Tags -->
    <title>Degala Siva Ganesh | AI & Data Science</title>
    <meta name="description" content="Portfolio of Degala Siva Ganesh, a B.Tech AI & Data Science student at BVCITS, Class of 2029.">
    <meta name="keywords" content="Degala Siva Ganesh, AI Data Science student, BVCITS, Portfolio, Amalapuram">
    <meta name="author" content="Degala Siva Ganesh">

    <!-- Premium Google Fonts: Syne (Hero/Headings), Space Grotesk (Sub-headings), JetBrains Mono (Code/Labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        syne: ['Syne', 'sans-serif'],
                        grotesk: ['"Space Grotesk"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        dark: {
                            950: '#050505',
                            900: '#080808',
                            850: '#0f0f0f',

                    animation: {
                        'pulse-glow': 'pulseGlow 4s ease-in-out infinite',

                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-6px)' },
                        }

                }
            }
        }

    <!-- React 18 & Babel Standalone -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="supabase-config.js"></script>

    <!-- Custom Style Overrides -->
    <style>
        body {
            background-color: #070707;
            color: #e5e5e5;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            selection-background-color: #ffffff;
            selection-color: #000000;
        }

        /* Accessibility Focus Visible */
        :focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 2px;
            border-radius: 6px;
        }

        /* Custom Editorial Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #070707; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #525252; }

        /* Subtle grid background pattern */
        .bg-grid-pattern {
            background-size: 60px 60px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.018) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
        }

        /* Smooth headline transition */
        .headline-fade-enter { animation: fadeInWord 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeInWord {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Toast Animation */
        @keyframes slideInUp {
            from { transform: translateY(100%) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        .animate-toast { animation: slideInUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Card Micro-interactions */
        .hover-card-glow { transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease, box-shadow 0.3s ease; }
        .hover-card-glow:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 12px 32px -10px rgba(255, 255, 255, 0.06);
        }
    </style>
</head>
<body class="bg-[#070707] text-neutral-200 selection:bg-white selection:text-black antialiased bg-grid-pattern">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const FALLBACK_PROFILE = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='1000' viewBox='0 0 800 1000'><rect width='100%' height='100%' fill='%23141414'/><path d='M400 450a150 150 0 1 0 0-300 150 150 0 0 0 0 300zm0 80c-180 0-320 120-320 270v50h640v-50c0-150-140-270-320-270z' fill='%23262626'/><text x='400' y='920' font-family='sans-serif' font-size='28' fill='%23525252' text-anchor='middle'>SIVA GANESH</text></svg>";
        const FALLBACK_PROJECT = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='600' viewBox='0 0 900 600'><rect width='100%' height='100%' fill='%230f0f0f'/><rect x='80' y='80' width='740' height='440' rx='16' fill='%231a1a1a' stroke='%23333333' stroke-width='2'/><circle cx='130' cy='130' r='10' fill='%23ef4444'/><circle cx='165' cy='130' r='10' fill='%23f59e0b'/><circle cx='200' cy='130' r='10' fill='%2310b981'/><text x='450' y='320' font-family='monospace' font-size='22' fill='%23737373' text-anchor='middle'>[ SYSTEM MODULE ]</text></svg>";

        function copyToClipboard(text, onSuccess) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(onSuccess).catch(() => fallbackCopy(text, onSuccess));
            } else {
                fallbackCopy(text, onSuccess);
            }
        }

        function fallbackCopy(text, onSuccess) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try { document.execCommand('copy'); if (onSuccess) onSuccess(); } catch (err) {}
            document.body.removeChild(textArea);
        }

        const ADMIN_EMAIL = "sivaganeshdegala@gmail.com";
        const SUPABASE_CONFIG = window.__SUPABASE_CONFIG__ || {};
        const supabaseClient = window.supabase && SUPABASE_CONFIG.url && SUPABASE_CONFIG.publishableKey
            ? window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.publishableKey)
            : null;

        const DEFAULT_DATA = {
            personal: {
                name: "Degala Siva Ganesh",
                tagline: "HI, I'M SIVA GANESH",
                roles: [
                    "2ND YEAR B.TECH AI & DATA SCIENCE",
                    "LEARNING SOFTWARE DEVELOPMENT",
                    "EXPLORING AI & DATA SCIENCE"
                ],
                bio: "2nd Year B.Tech AI & Data Science student learning programming and exploring software development, AI and data science.",
                location: "Amalapuram, Andhra Pradesh, India",
                email: "sivaganeshdegala@gmail.com",
                phone: "9676781879",
                degree: "B.Tech – Artificial Intelligence & Data Science",
                college: "Bonam Venkata Chalamayya Institute of Technology and Science (BVCITS)",
                graduation: "2029",
                github: "https://github.com/sivaganeshdegala-sketch",
                linkedin: "https://www.linkedin.com/in/siva-degala-990621373",
                instagram: "https://instagram.com/mr_avis",
                leetcode: "https://leetcode.com/u/Sivadegala",
                hackerrank: "https://www.hackerrank.com/profile/sivaganeshdegala",
                status: "2nd Year B.Tech AI & Data Science student, Class of 2029",
                image: "profile.jpg"
            },
            skills: [
                { name: "C (learning/using)", category: "Languages" },
                { name: "Java (learning/using)", category: "Languages" },
                { name: "Python (learning/using)", category: "Languages" },
                { name: "AI & Machine Learning (exploring)", category: "AI / ML & Data" },
                { name: "Data Science (learning)", category: "AI / ML & Data" },
                { name: "HTML & CSS", category: "Full-Stack" },
                { name: "JavaScript (learning)", category: "Languages" },
                { name: "React (learning/using)", category: "Full-Stack" },
                { name: "Tailwind CSS (learning/using)", category: "Full-Stack" },
                { name: "Node.js, SQL & MongoDB (exploring)", category: "Databases & Tools" },
                { name: "GenAI (exploring)", category: "AI / ML & Data" },
                { name: "Git & GitHub", category: "Databases & Tools" }
            ],
            projects: [
                {
                    id: "01",
                    title: "Personal Portfolio",
                    category: "Web Development",
                    description: "A personal portfolio built with React and Tailwind CSS, presenting my academic journey, skills, and projects.",
                    longDescription: "A single-page portfolio built with React and Tailwind CSS. It now uses Supabase for published projects, admin management, and contact message storage.",
                    technologies: ["React (learning/using)", "JavaScript", "Tailwind CSS", "HTML5"],
                    github: "https://github.com/sivaganeshdegala-sketch/degala-siva-ganesh-portfolio",
                    live: "https://sivaganeshdegala-sketch.github.io/degala-siva-ganesh-portfolio/",
                    image: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=900&q=80"
                },
                {
                    id: "02",
                    title: "Doctor Appointment Booking System",
                    category: "C Programming",
                    description: "A C-based command-line system for entering patient information, selecting a doctor, reviewing fees and available slots, choosing a date and time, and confirming a booking.",
                    longDescription: "This current version is a C command-line application. It supports patient information, doctor selection, fee and available-slot display, date and time selection, and booking confirmation. It does not currently include a database, login, admin panel, web backend, or online payments.",
                    technologies: ["C (Learning/Using)", "Command Line"],
                    github: "https://github.com/sivaganeshdegala-sketch",
                    live: "",
                    image: "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=900&q=80"
                }
            ],
            certifications: []
        };

        function mapProject(row) {
            const technologies = Array.isArray(row.technologies)
                ? row.technologies
                : (typeof row.technologies === "string" ? row.technologies.split(",").map(item => item.trim()).filter(Boolean) : []);
            return {
                id: row.id,
                title: row.title || "Untitled project",
                category: row.category || "Project",
                description: row.description || "",
                longDescription: row.long_description || row.description || "",
                technologies,
                github: row.github_url || "",
                live: row.live_url || "",
                image: row.image_url || "",
                isFeatured: Boolean(row.featured),
                isPublished: Boolean(row.published)
            };
        }

        function App() {
            const [portfolioData, setPortfolioData] = useState(DEFAULT_DATA);
            const [projects, setProjects] = useState(supabaseClient ? [] : DEFAULT_DATA.projects);
            const [projectsLoading, setProjectsLoading] = useState(Boolean(supabaseClient));
            const [projectsError, setProjectsError] = useState("");
            const [session, setSession] = useState(null);
            const [roleIndex, setRoleIndex] = useState(0);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [activeProjectModal, setActiveProjectModal] = useState(null);
            const [toastMessage, setToastMessage] = useState("");
            const [activeSection, setActiveSection] = useState("about");
            const [adminLoginOpen, setAdminLoginOpen] = useState(false);
            const [adminDashboardOpen, setAdminDashboardOpen] = useState(false);
            const isAdmin = session?.user?.email?.toLowerCase() === ADMIN_EMAIL;

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(""), 4000);
            };

            const openAdminRoute = () => {
                if (window.location.hash !== "#admin") window.location.hash = "admin";
                else if (isAdmin) setAdminDashboardOpen(true);
                else setAdminLoginOpen(true);
            };

            const closeAdminRoute = () => {
                setAdminLoginOpen(false);
                setAdminDashboardOpen(false);
                if (/\/admin\/?$/.test(window.location.pathname)) {
                    window.history.replaceState({}, "", window.location.pathname.replace(/admin\/?$/, "") || "/");
                } else if (window.location.hash === "#admin") {
                    window.location.hash = "about";
                }
            };

            useEffect(() => {
                const syncAdminRoute = () => {
                    if (window.location.hash === "#admin" || /\/admin\/?$/.test(window.location.pathname)) {
                        setAdminLoginOpen(!isAdmin);
                        setAdminDashboardOpen(isAdmin);
                    }
                };
                syncAdminRoute();
                window.addEventListener("hashchange", syncAdminRoute);
                return () => window.removeEventListener("hashchange", syncAdminRoute);
            }, [isAdmin]);

            useEffect(() => {
                if (mobileMenuOpen || activeProjectModal || adminLoginOpen || adminDashboardOpen) {
                    document.body.style.overflow = "hidden";
                } else {
                    document.body.style.overflow = "unset";
                }
            }, [mobileMenuOpen, activeProjectModal, adminLoginOpen, adminDashboardOpen]);

            useEffect(() => {
                if (!supabaseClient) return;
                let alive = true;
                supabaseClient.from("projects").select("*").eq("published", true)
                    .order("featured", { ascending: false }).order("created_at", { ascending: false })
                    .then(({ data, error }) => {
                        if (!alive) return;
                        if (error) setProjectsError("Projects could not be loaded. Check the Supabase table and RLS setup.");
                        else setProjects((data || []).map(mapProject));
                        setProjectsLoading(false);
                    });
                supabaseClient.from("portfolio_profile").select("data").eq("id", "main").maybeSingle()
                    .then(({ data, error }) => {
                        if (alive && !error && data?.data) setPortfolioData(current => ({ ...current, personal: { ...current.personal, ...data.data } }));
                    });
                supabaseClient.auth.getSession().then(({ data }) => {
                    if (alive && data.session?.user?.email?.toLowerCase() === ADMIN_EMAIL) setSession(data.session);
                });
                const { data: authListener } = supabaseClient.auth.onAuthStateChange((_event, nextSession) => {
                    if (nextSession?.user?.email?.toLowerCase() === ADMIN_EMAIL) setSession(nextSession);
                    else setSession(null);
                });
                return () => {
                    alive = false;
                    authListener.subscription.unsubscribe();
                };
            }, []);

            useEffect(() => {
                const timer = setInterval(() => {
                    setRoleIndex((prev) => (prev + 1) % portfolioData.personal.roles.length);
                }, 3200);
                return () => clearInterval(timer);
            }, [portfolioData.personal.roles.length]);

            useEffect(() => {
                const sections = document.querySelectorAll("section[id]");
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            setActiveSection(entry.target.id);
                        }
                    });
                }, { threshold: 0.3 });

                sections.forEach(sec => observer.observe(sec));
                return () => observer.disconnect();
            }, []);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === "Escape") {
                        setActiveProjectModal(null);
                        setMobileMenuOpen(false);
                        closeAdminRoute();
                    }
                    if (e.ctrlKey && e.shiftKey && e.key === 'A') {
                        openAdminRoute();
                    }
                };
                window.addEventListener("keydown", handleKeyDown);
                return () => window.removeEventListener("keydown", handleKeyDown);
            }, [isAdmin]);

            const handleContactSubmit = async (msgData) => {
                if (!supabaseClient) throw new Error("Contact form is not configured yet.");
                const { error } = await supabaseClient.from("messages").insert({
                    name: msgData.name.trim(),
                    email: msgData.email.trim(),
                    message: msgData.message.trim()
                });
                if (error) throw error;
                try {
                    const { data, error: notificationError } = await supabaseClient.functions.invoke("contact-notification", {
                        body: {
                            name: msgData.name.trim(),
                            email: msgData.email.trim(),
                            message: msgData.message.trim()
                        }
                    });
                    return { notificationSent: !notificationError && data?.sent === true };
                } catch {
                    return { notificationSent: false };
                }
            };

            const handleLogin = async (email, password) => {
                if (!supabaseClient) throw new Error("Supabase is not configured.");
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;
                if (data.user?.email?.toLowerCase() !== ADMIN_EMAIL) {
                    await supabaseClient.auth.signOut();
                    throw new Error("This account is not authorized for portfolio administration.");
                }
                setSession(data.session);
                setAdminLoginOpen(false);
                setAdminDashboardOpen(true);
            };

            const handleSaveProfile = async (personal) => {
                const { error } = await supabaseClient.from("portfolio_profile").upsert({ id: "main", data: personal });
                if (error) throw error;
                setPortfolioData(current => ({ ...current, personal }));
            };

            return (
                <div className="min-h-screen relative bg-[#070707] text-neutral-100 font-grotesk overflow-x-hidden selection:bg-white selection:text-black">
                    <Navbar
                        name={portfolioData.personal.name}
                        mobileMenuOpen={mobileMenuOpen}
                        setMobileMenuOpen={setMobileMenuOpen}
                        activeSection={activeSection}
                    />

                    <HeroSection
                        personal={portfolioData.personal}
                        currentRole={portfolioData.personal.roles[roleIndex]}
                        roleIndex={roleIndex}
                        setRoleIndex={setRoleIndex}
                        rolesCount={portfolioData.personal.roles.length}
                    />

                    <AboutSection
                        personal={portfolioData.personal}
                        onCopyEmail={() => {
                            copyToClipboard(portfolioData.personal.email, () => showToast("Email copied to clipboard!"));
                        }}
                    />

                    <SkillsSection skills={portfolioData.skills} />

                    <ProjectsSection
                        projects={projects}
                        loading={projectsLoading}
                        error={projectsError}
                        onOpenProject={(proj) => setActiveProjectModal(proj)}
                    />

                    <CertificationsSection
                        certs={portfolioData.certifications}
                        onVerify={(c) => showToast(`Credential Verified: ${c.credentialId}`)}
                    />

                    <ContactSection
                        personal={portfolioData.personal}
                        onSubmit={handleContactSubmit}
                        onCopyEmail={() => {
                            copyToClipboard(portfolioData.personal.email, () => showToast("Email copied to clipboard!"));
                        }}
                    />

                    <Footer
                        name={portfolioData.personal.name}
                        personal={portfolioData.personal}
                        onAdminClick={openAdminRoute}
                    />

                    {activeProjectModal && (
                        <ProjectDetailModal
                            project={activeProjectModal}
                            onClose={() => setActiveProjectModal(null)}
                        />
                    )}

                    {/* Admin Portals */}
                    {adminLoginOpen && (
                        <AdminLoginModal
                            onClose={closeAdminRoute}
                            onLogin={handleLogin}
                        />
                    )}
                    {adminDashboardOpen && isAdmin && (
                        <AdminDashboardModal
                            client={supabaseClient}
                            personal={portfolioData.personal}
                            onSaveProfile={handleSaveProfile}
                            onClose={closeAdminRoute}
                            onLogout={async () => {
                                closeAdminRoute();
                                await supabaseClient.auth.signOut();
                                setSession(null);
                                setAdminDashboardOpen(false);
                                showToast("Signed out.");
                            }}
                            showToast={showToast}
                        />
                    )}

                    {toastMessage && <Toast message={toastMessage} onClose={() => setToastMessage("")} />}
                </div>
            );
        }

        // --- COMPONENTS ---

        function Navbar({ name, mobileMenuOpen, setMobileMenuOpen, activeSection }) {
            const navLinks = [
                { id: "about", label: "About" },
                { id: "skills", label: "Skills" },
                { id: "projects", label: "Projects" },
                { id: "contact", label: "Contact" },
            ];

            const brandName = name.split(' ').pop() || name;

            return (
                <header className="fixed top-0 left-0 right-0 z-50 px-4 sm:px-8 py-5">
                    <div className="max-w-7xl mx-auto flex items-center justify-between">
                        <a href="#" className="font-syne font-extrabold text-xl sm:text-2xl tracking-tight text-white hover:opacity-80 transition-opacity">
                            {brandName}<span className="text-neutral-500">.</span>
                        </a>

                        <nav className="hidden md:flex items-center space-x-1 px-4 py-2 rounded-full bg-neutral-900/90 backdrop-blur-md border border-neutral-800/80 text-xs font-mono tracking-wider uppercase text-neutral-400 shadow-2xl">
                            {navLinks.map((link) => (
                                <a key={link.id} href={`#${link.id}`}
                                    className={`px-3 py-1.5 rounded-full transition-all duration-300 ${activeSection === link.id ? "bg-white text-black font-bold shadow-sm" : "hover:text-white hover:bg-neutral-800/50"}`}>
                                    {link.label}
                                </a>
                            ))}
                        </nav>

                        <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="md:hidden p-3 rounded-full bg-neutral-900 border border-neutral-800 text-white font-mono text-sm">
                            {mobileMenuOpen ? '✕' : '☰'}
                        </button>
                    </div>

                    {mobileMenuOpen && (
                        <div className="md:hidden mt-3 rounded-2xl bg-neutral-950/95 backdrop-blur-xl border border-neutral-800 p-6 space-y-4 text-center font-mono text-xs uppercase tracking-widest text-neutral-300 shadow-2xl animate-toast">
                            {navLinks.map((link) => (
                                <a key={link.id} href={`#${link.id}`} onClick={()=>setMobileMenuOpen(false)}
                                    className={`block py-2.5 rounded-xl transition-colors ${activeSection === link.id ? "bg-white/10 text-white font-bold" : "hover:text-white hover:bg-neutral-900"}`}>
                                    {link.label}
                                </a>
                            ))}
                        </div>
                    )}
                </header>
            );
        }

        function HeroSection({ personal, currentRole, roleIndex, setRoleIndex, rolesCount }) {
            return (
                <section className="relative min-h-screen pt-32 pb-20 flex flex-col justify-between px-4 sm:px-8 max-w-7xl mx-auto">
                    <div className="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-neutral-800/20 rounded-full blur-[140px] pointer-events-none"></div>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center relative z-10 my-auto">
                        <div className="lg:col-span-7 space-y-8">
                            <div className="space-y-4">
                                <div className="flex items-center space-x-3">
                                    <span className="text-xs font-mono uppercase tracking-[0.25em] text-neutral-400 block">
                                        {personal.tagline}
                                    </span>
                                    <div className="flex space-x-1.5 items-center">
                                        {Array.from({ length: rolesCount }).map((_, i) => (
                                            <button key={i} onClick={() => setRoleIndex(i)}
                                                className={`w-2 h-2 rounded-full transition-all duration-300 ${i === roleIndex ? "bg-white w-5" : "bg-neutral-700"}`} />
                                        ))}
                                    </div>
                                </div>

                                <div className="h-28 sm:h-36 lg:h-44 flex items-center">
                                    <h1 key={currentRole} className="font-syne font-extrabold text-4xl sm:text-6xl lg:text-7xl text-white tracking-tight leading-[0.95] uppercase headline-fade-enter">
                                        {currentRole.split(' ').map((word, idx) => (
                                            <span key={idx} className="block">{word}</span>
                                        ))}
                                    </h1>
                                </div>
                            </div>

                            <p className="text-neutral-400 text-sm sm:text-base max-w-xl font-light leading-relaxed">
                                {personal.bio}
                            </p>

            );
        }

        function AdminDashboardModal({ client, personal, onSaveProfile, onClose, onLogout, showToast }) {
            const [tab, setTab] = useState('profile');
            const [profile, setProfile] = useState(personal);
            const [projects, setProjects] = useState([]);
            const [messages, setMessages] = useState([]);
            const [loadError, setLoadError] = useState("");
            const [projectForm, setProjectForm] = useState(null);
            const [saving, setSaving] = useState(false);

            const loadAdminData = async () => {
                const [projectResult, messageResult] = await Promise.all([
                    client.from("projects").select("*").order("created_at", { ascending: false }),
                    client.from("messages").select("*").order("created_at", { ascending: false })
                ]);
                if (projectResult.error || messageResult.error) {
                    setLoadError("Could not load admin data. Confirm the admin RLS policies are installed.");
                    return;
                }
                setProjects((projectResult.data || []).map(mapProject));
                setMessages(messageResult.data || []);
            };

            useEffect(() => { loadAdminData(); }, []);

            const saveProfile = async () => {
                setSaving(true);
                try {
                    await onSaveProfile(profile);
                    showToast("Profile saved to Supabase.");
                } catch (error) {
                    showToast(error.message || "Profile could not be saved.");
                } finally { setSaving(false); }
            };

            const saveProject = async (event) => {
                event.preventDefault();
                setSaving(true);
                const row = {
                    title: projectForm.title.trim(),
                    description: projectForm.description.trim(),
                    technologies: projectForm.technologies.split(",").map(item => item.trim()).filter(Boolean),
                    github_url: projectForm.github.trim() || null,
                    live_url: projectForm.live.trim() || null,
                    image_url: projectForm.image.trim() || null,
                    published: projectForm.isPublished,
                    featured: projectForm.isFeatured
                };
                if (projectForm.id) row.id = projectForm.id;
                const result = projectForm.id
                    ? await client.from("projects").update(row).eq("id", projectForm.id)
                    : await client.from("projects").insert(row);
                const { error } = result;
                setSaving(false);
                if (error) { showToast(error.message); return; }
                setProjectForm(null);
                await loadAdminData();
                showToast("Project saved.");
            };

            const toggleProject = async (project, field) => {
                const column = field === "isPublished" ? "published" : "featured";
                const { error } = await client.from("projects").update({ [column]: !project[field] }).eq("id", project.id);
                if (error) showToast(error.message);
                else { await loadAdminData(); showToast("Project updated."); }
            };

            const deleteProject = async (project) => {
                if (!confirm(`Delete ${project.title}?`)) return;
                const { error } = await client.from("projects").delete().eq("id", project.id);
                if (error) showToast(error.message);
                else { await loadAdminData(); showToast("Project deleted."); }
            };

            const deleteMessage = async (message) => {
                if (!confirm("Delete this contact message?")) return;
                const { error } = await client.from("messages").delete().eq("id", message.id);
                if (error) showToast(error.message);
                else { await loadAdminData(); showToast("Message deleted."); }
            };

            const emptyProject = {
                id: "", title: "", description: "", technologies: "",
                github: "", live: "", image: "", isPublished: false, isFeatured: false
            };

            return (
                <div className="fixed inset-0 z-[100] bg-[#070707] flex flex-col font-mono text-sm animate-toast overflow-hidden">
                    {/* Admin Header */}
                    <header className="px-6 py-4 border-b border-neutral-800 flex justify-between items-center bg-neutral-950">
                        <div className="flex items-center space-x-4">
                            <span className="text-white font-syne font-bold text-xl">System Admin Dashboard</span>
                            <span className="px-2 py-1 rounded bg-emerald-900/50 text-emerald-400 text-[10px] border border-emerald-800">SUPABASE</span>
                        </div>
                        <div className="flex space-x-3">
                            <button onClick={onLogout} className="px-4 py-2 rounded border border-neutral-700 text-neutral-300 hover:text-white text-xs">Logout</button>
                            <button onClick={onClose} className="px-4 py-2 rounded bg-white text-black font-bold text-xs">Close Dashboard</button>
                        </div>
                    </header>

                    <div className="flex flex-1 overflow-hidden">
                        {/* Sidebar Tabs */}
                        <div className="w-64 border-r border-neutral-800 bg-neutral-900/30 p-4 space-y-2">
                                    {['profile', 'messages', 'projects'].map(t => (
                                <button key={t} onClick={() => setTab(t)}
                                    className={`w-full text-left px-4 py-3 rounded-lg uppercase tracking-wider text-xs transition-colors ${tab === t ? 'bg-neutral-800 text-white font-bold' : 'text-neutral-500 hover:bg-neutral-800/50 hover:text-neutral-300'}`}>
                                            {t} {t === 'messages' && `(${messages.length})`}
                                </button>
                            ))}
                        </div>

                        {/* Content Area */}
                        <div className="flex-1 overflow-y-auto p-8 bg-[#0a0a0a]">
                            {loadError && <p role="alert" className="text-red-400 text-sm mb-6">{loadError}</p>}
                            {tab === 'profile' && (
                                <div className="max-w-2xl space-y-6">
                                    <h2 className="text-white font-syne text-2xl mb-6">Edit Profile Data</h2>
                                    <div className="space-y-4">
                                        {['name', 'tagline', 'bio', 'status', 'degree', 'college', 'graduation', 'location', 'email', 'phone', 'github', 'linkedin', 'instagram', 'leetcode', 'hackerrank', 'image'].map(key => (
                                            <div key={key} className="flex flex-col">
                                                <label className="text-xs text-neutral-500 uppercase mb-1">{key}</label>
                                                {key === 'bio' ? (
                                                    <textarea rows="4" className="bg-neutral-900 border border-neutral-800 text-white p-3 rounded focus:border-neutral-500"
                                                        value={profile[key] || ''} onChange={e => setProfile({...profile, [key]: e.target.value})} />
                                                ) : (
                                                    <input type="text" className="bg-neutral-900 border border-neutral-800 text-white p-3 rounded focus:border-neutral-500"
                                                        value={profile[key] || ''} onChange={e => setProfile({...profile, [key]: e.target.value})} />
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={saveProfile} disabled={saving} className="px-5 py-3 rounded-lg bg-white text-black font-bold text-xs disabled:opacity-50">{saving ? "Saving..." : "Save Profile"}</button>
                                </div>
                            )}

                            {tab === 'messages' && (
                                <div className="space-y-4">
                                    <h2 className="text-white font-syne text-2xl mb-6">Database: Contact Form Inquiries</h2>
                                    {messages.length === 0 ? (
                                        <p className="text-neutral-500">No messages found.</p>
                                    ) : (
                                        messages.map(m => (
                                            <div key={m.id} className="p-5 rounded-xl border border-neutral-800 bg-neutral-900 space-y-3 relative group">
                                                <button onClick={() => deleteMessage(m)} className="absolute top-4 right-4 text-neutral-600 hover:text-red-400">Delete</button>
                                                <div className="flex gap-4 text-xs text-neutral-500">
                                                    <span className="text-neutral-300">{m.name}</span>
                                                    <span>{m.email}</span>
                                                    <span>{new Date(m.created_at).toLocaleString()}</span>
                                                </div>
                                                <p className="text-white text-base font-sans">{m.message}</p>
                                            </div>
                                        ))
                                    )}
                                </div>
                            )}

                            {tab === 'projects' && (
                                <div className="space-y-6">
                                    <div className="flex items-center justify-between gap-4">
                                        <h2 className="text-white font-syne text-2xl">Manage Projects</h2>
                                        <button onClick={() => setProjectForm({ ...emptyProject })} className="px-4 py-2 rounded bg-white text-black text-xs font-bold">Add Project</button>
                                    </div>
                                    {projectForm && (
                                        <form onSubmit={saveProject} className="grid grid-cols-1 md:grid-cols-2 gap-3 p-5 border border-neutral-800 rounded bg-neutral-900">
                                            {[['title','Title'],['description','Description'],['technologies','Technologies (comma separated)'],['github','GitHub URL'],['live','Live URL'],['image','Image URL']].map(([key,label]) => (
                                                <label key={key} className="text-xs text-neutral-500">{label}
                                                    {['description','longDescription'].includes(key)
                                                        ? <textarea required rows="3" value={projectForm[key]} onChange={event => setProjectForm({ ...projectForm, [key]: event.target.value })} className="mt-1 w-full bg-neutral-950 border border-neutral-800 text-white p-3 rounded" />
                                                        : <input required={key === 'title'} type="text" value={projectForm[key]} onChange={event => setProjectForm({ ...projectForm, [key]: event.target.value })} className="mt-1 w-full bg-neutral-950 border border-neutral-800 text-white p-3 rounded" />}
                                                </label>
                                            ))}
                                            <label className="flex items-center gap-2 text-xs text-neutral-300"><input type="checkbox" checked={projectForm.isPublished} onChange={event => setProjectForm({ ...projectForm, isPublished: event.target.checked })} /> Published</label>
                                            <label className="flex items-center gap-2 text-xs text-neutral-300"><input type="checkbox" checked={projectForm.isFeatured} onChange={event => setProjectForm({ ...projectForm, isFeatured: event.target.checked })} /> Featured</label>
                                            <div className="md:col-span-2 flex gap-3">
                                                <button disabled={saving} className="px-4 py-2 rounded bg-white text-black text-xs font-bold">{saving ? "Saving..." : "Save Project"}</button>
                                                <button type="button" onClick={() => setProjectForm(null)} className="px-4 py-2 rounded border border-neutral-700 text-xs">Cancel</button>
                                            </div>
                                        </form>
                                    )}
                                    {projects.length === 0 && <p className="text-neutral-500">No projects in the database.</p>}
                                    {projects.map(project => (
                                            <div key={project.id} className="p-4 border border-neutral-800 rounded bg-neutral-900 flex flex-wrap items-center justify-between gap-4">
                                            <div><h4 className="text-white font-bold">{project.title}</h4><p className="text-neutral-500 text-xs">{project.category} · {project.isPublished ? "Published" : "Draft"} · {project.isFeatured ? "Featured" : "Not featured"}</p></div>
                                            <div className="flex flex-wrap gap-2">
                                                <button onClick={() => setProjectForm({ ...project, technologies: project.technologies.join(", ") })} className="px-3 py-2 border border-neutral-700 rounded text-xs">Edit</button>
                                                <button onClick={() => toggleProject(project, "isPublished")} className="px-3 py-2 border border-neutral-700 rounded text-xs">{project.isPublished ? "Unpublish" : "Publish"}</button>
                                                <button onClick={() => toggleProject(project, "isFeatured")} className="px-3 py-2 border border-neutral-700 rounded text-xs">{project.isFeatured ? "Unfeature" : "Feature"}</button>
                                                <button onClick={() => deleteProject(project)} className="px-3 py-2 border border-red-900 text-red-400 rounded text-xs">Delete</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function Toast({ message, onClose }) {
            return (
                <div className="fixed bottom-6 right-6 z-[200] px-5 py-3 rounded-2xl bg-white text-black font-mono text-xs font-bold shadow-2xl flex items-center space-x-3 animate-toast border border-neutral-200">
                    <span>✓</span>
                    <span>{message}</span>
                    <button onClick={onClose} className="ml-2 text-neutral-500 hover:text-black">✕</button>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
